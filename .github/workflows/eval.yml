name: eval

# Blocks a pull request that makes the pipeline measurably worse.
#
# The gate runs a stratified 20-question subset with the deterministic
# evaluators only: no judge calls, so a CI run costs nothing and finishes in
# a couple of minutes. Faithfulness and correctness are graded locally, where
# a human can look at them.

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch, as the Dockerfile does. The default wheel drags in
          # ~2 GB of CUDA libraries that a GitHub runner cannot use, which is
          # the difference between a 1-minute install and a 10-minute one.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
      - name: Run the offline suite
        run: python -m pytest tests -q

  gate:
    name: regression gate
    runs-on: ubuntu-latest
    # Forks do not get repository secrets, so the pipeline cannot run there.
    # The unit job above still protects the harness itself.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch, as the Dockerfile does. The default wheel drags in
          # ~2 GB of CUDA libraries that a GitHub runner cannot use, which is
          # the difference between a 1-minute install and a 10-minute one.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Cache the FAISS index and judge verdicts
        uses: actions/cache@v4
        with:
          path: reports/.index-cache
          key: index-${{ hashFiles('policies_content.py', 'configs/baseline.yaml') }}
      - name: Build data artifacts
        run: python cli.py --setup
      - name: Run the gated subset
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "No GROQ_API_KEY secret set; skipping the gate."
            echo "Add one in Settings -> Secrets to turn this on."
            exit 0
          fi
          python -m evalkit.runner --config configs/baseline.yaml --sample 20
          python -m evalkit.score --no-judge
          python -m evalkit.gate
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/*.md
          if-no-files-found: ignore
